name: CI

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Инструменты устанавливает только setup-шаг каждого job.
  MISE_AUTO_INSTALL: "false"

jobs:
  scope_detector:
    name: Detect CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      project_required: ${{ steps.scope.outputs.project_required }}
      openspec_required: ${{ steps.scope.outputs.openspec_required }}
      android_required: ${{ steps.scope.outputs.android_required }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect CI scope
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tool/check_ci_scope.sh

  static_checks:
    name: Static checks
    needs: scope_detector
    if: ${{ needs.scope_detector.outputs.project_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.1
          install_args: flutter
          cache: true
          cache_save: true

      - name: Verify generated artifacts
        run: mise run --skip-tools codegen-check

      - name: Verify generated-artifact detector negative paths
        run: mise run --skip-tools codegen-check-test

      - name: Run static checks
        run: mise run --skip-tools check:static

  tests:
    name: Tests ${{ matrix.shard }}
    needs: scope_detector
    if: ${{ needs.scope_detector.outputs.project_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Все части доходят до конца, чтобы прогон показал все упавшие тесты.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.1
          install_args: flutter
          cache: true
          cache_save: true

      - name: Run test shard
        run: mise run --skip-tools check:tests -- ${{ strategy.job-index }} ${{ strategy.job-total }}

  process_tests:
    name: Process tests
    needs: scope_detector
    if: ${{ needs.scope_detector.outputs.project_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.1
          install_args: flutter
          cache: true
          cache_save: true

      - name: Run process tests
        run: mise run --skip-tools check:process-tests

  openspec_checks:
    name: OpenSpec checks
    needs: scope_detector
    if: ${{ needs.scope_detector.outputs.openspec_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned OpenSpec toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.1
          install_args: "node npm:@fission-ai/openspec"
          cache: true
          cache_save: true

      - name: Validate OpenSpec changes
        run: openspec validate --all --strict --no-interactive

  android_artifact:
    name: Android artifact evidence
    needs: scope_detector
    if: ${{ needs.scope_detector.outputs.android_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
      ANDROID_PLATFORM_VERSION: "36"
      RELEASE_APK: build/app/outputs/flutter-apk/app-release.apk

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17.0.16+8"

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.1
          install_args: flutter
          cache: true
          cache_save: true

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "${ANDROID_HOME:?ANDROID_HOME is not set}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify packaged Android privacy manifest
        shell: bash
        run: |
          set -euo pipefail

          android_sdk="${ANDROID_HOME:?ANDROID_HOME is not set}"
          aapt2="${android_sdk}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/aapt2"

          dart run tool/check_android_privacy_manifest.dart \
            "${aapt2}" \
            "${RELEASE_APK}"

  full_checks:
    name: Full checks
    needs:
      - scope_detector
      - static_checks
      - tests
      - process_tests
      - openspec_checks
      - android_artifact
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Enforce aggregate gate
        shell: bash
        env:
          PROJECT_REQUIRED: ${{ needs.scope_detector.outputs.project_required }}
          OPENSPEC_REQUIRED: ${{ needs.scope_detector.outputs.openspec_required }}
          ANDROID_REQUIRED: ${{ needs.scope_detector.outputs.android_required }}
          STATIC_RESULT: ${{ needs.static_checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          PROCESS_RESULT: ${{ needs.process_tests.result }}
          OPENSPEC_RESULT: ${{ needs.openspec_checks.result }}
          ANDROID_RESULT: ${{ needs.android_artifact.result }}
          SCOPE_RESULT: ${{ needs.scope_detector.result }}
        run: |
          set -euo pipefail

          if [[ "$SCOPE_RESULT" != success ]]; then
            echo "CI scope detector не завершился успешно" >&2
            exit 1
          fi

          require_job_result() {
            local required="$1"
            local result="$2"
            local job_name="$3"

            case "$required" in
            true)
              if [[ "$result" != success ]]; then
                echo "Обязательный job '$job_name' не завершился успешно" >&2
                exit 1
              fi
              ;;
            false)
              if [[ "$result" != skipped ]]; then
                echo "Job '$job_name' не был безопасно пропущен" >&2
                exit 1
              fi
              ;;
            *)
              echo "Решение для job '$job_name' отсутствует или имеет неверный формат" >&2
              exit 1
              ;;
            esac
          }

          require_job_result "$PROJECT_REQUIRED" "$STATIC_RESULT" "Static checks"
          require_job_result "$PROJECT_REQUIRED" "$TESTS_RESULT" "Tests"
          require_job_result "$PROJECT_REQUIRED" "$PROCESS_RESULT" "Process tests"
          require_job_result "$OPENSPEC_REQUIRED" "$OPENSPEC_RESULT" "OpenSpec checks"
          require_job_result "$ANDROID_REQUIRED" "$ANDROID_RESULT" "Android artifact evidence"
