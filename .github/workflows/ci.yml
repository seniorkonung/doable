name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  full-checks:
    name: Full checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
      ANDROID_PLATFORM_VERSION: "36"
      RELEASE_APK: build/app/outputs/flutter-apk/app-release.apk

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17.0.16+8"

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.1

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "${ANDROID_HOME:?ANDROID_HOME is not set}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Verify generated artifacts
        run: mise run codegen-check

      - name: Run full project checks
        run: mise run check

      - name: Validate OpenSpec changes
        run: mise exec -- openspec validate --all --strict --no-interactive

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify packaged Android privacy manifest
        shell: bash
        run: |
          set -euo pipefail

          android_sdk="${ANDROID_HOME:?ANDROID_HOME is not set}"
          aapt2="${android_sdk}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/aapt2"

          test -x "${aapt2}"
          test -f "${RELEASE_APK}"

          permissions="$("${aapt2}" dump permissions "${RELEASE_APK}")"
          manifest="$("${aapt2}" dump xmltree "${RELEASE_APK}" --file AndroidManifest.xml)"
          resources="$("${aapt2}" dump resources "${RELEASE_APK}")"

          forbidden_permissions=(
            android.permission.INTERNET
            android.permission.READ_EXTERNAL_STORAGE
            android.permission.WRITE_EXTERNAL_STORAGE
            android.permission.MANAGE_EXTERNAL_STORAGE
            android.permission.READ_MEDIA_IMAGES
            android.permission.READ_MEDIA_VIDEO
            android.permission.READ_MEDIA_AUDIO
          )

          for permission in "${forbidden_permissions[@]}"; do
            if grep -Fq "uses-permission: name='${permission}'" <<<"${permissions}"; then
              echo "Forbidden permission in release APK: ${permission}" >&2
              exit 1
            fi
          done

          if ! grep -Eq ':allowBackup\([^)]*\)=true$' <<<"${manifest}"; then
            echo "Release APK does not enable the approved backup rules" >&2
            exit 1
          fi

          assert_xml_reference() {
            local attribute="$1"
            local expected_resource="$2"
            local resource_id

            resource_id="$(sed -nE "s/.*:${attribute}\\([^)]*\\)=@(0x[[:xdigit:]]+).*/\\1/p" <<<"${manifest}")"

            if [[ -z "${resource_id}" ]] ||
              ! grep -Fq "resource ${resource_id} xml/${expected_resource}" <<<"${resources}"; then
              echo "Release APK has no ${attribute} reference to @xml/${expected_resource}" >&2
              exit 1
            fi
          }

          assert_xml_reference fullBackupContent backup_rules
          assert_xml_reference dataExtractionRules data_extraction_rules
