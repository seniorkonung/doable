name: doable_widgetbook
description: "Widgetbook для Doable: песочница стиля и каталог компонентов."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  # Каталог показывает виджеты самого приложения. Зависимость направлена от
  # каталога к приложению, поэтому в его release APK ничего не добавляет.
  doable:
    path: ../
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  widgetbook: ^3.25.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - packages/doable/src/design_system/icons/assets/home.svg
    - packages/doable/src/design_system/icons/assets/home_filled.svg
    - packages/doable/src/design_system/icons/assets/calendar_days.svg
    - packages/doable/src/design_system/icons/assets/calendar_days_filled.svg
    - packages/doable/src/design_system/icons/assets/graph.svg
    - packages/doable/src/design_system/icons/assets/graph_filled.svg
    - packages/doable/src/design_system/icons/assets/plus.svg
    - packages/doable/src/design_system/icons/assets/intention.svg
    - packages/doable/src/design_system/icons/assets/relation.svg
    - packages/doable/src/design_system/icons/assets/calendar.svg
    - packages/doable/src/design_system/icons/assets/intention_mini.svg
    - packages/doable/src/design_system/icons/assets/relation_mini.svg
    - packages/doable/src/design_system/icons/assets/calendar_mini.svg
    - packages/doable/src/design_system/icons/assets/from_intention.svg
    - packages/doable/src/design_system/icons/assets/from_action.svg
    - packages/doable/src/design_system/icons/assets/check.svg
    - packages/doable/src/design_system/icons/assets/chevron_right.svg
  fonts:
    - family: Inter
      fonts:
        - asset: packages/doable/src/design_system/fonts/InterVariable.ttf
