include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # У приложения нет публичной библиотеки: его виджеты лежат в `lib/src`,
    # и каталог импортирует их оттуда.
    implementation_imports: false
