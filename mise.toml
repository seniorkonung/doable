[tools]
flutter = "3.47.1"
node = "26.4.0"
"github:microsoft/apm" = "0.30.0"
lefthook = "2.1.9"
"npm:@fission-ai/openspec" = "1.13.0"

[tasks]
prepare = "lefthook install"
start = "flutter run"
check = [
    "dart format --output=none --set-exit-if-changed .",
    "bash test/tool/check_ci_scope_test.sh",
    "flutter analyze",
    "flutter test --concurrency=2"
]
check-fast = [
    "dart format --output=none --set-exit-if-changed .",
    "bash test/tool/check_ci_scope_test.sh",
    "flutter analyze",
    "flutter test --exclude-tags=slow"
]
codegen = [
    "flutter gen-l10n",
    "dart run build_runner build --delete-conflicting-outputs",
    "dart run drift_dev schema dump lib/src/data/local/app_database.dart drift_schemas/",
    "dart run drift_dev schema steps drift_schemas/ lib/src/data/local/migrations/generated_schema.dart"
]
codegen-check = "bash tool/check_generated.sh"
codegen-check-test = "bash tool/check_generated_test.sh"
setup = [
    "apm install --frozen",
    "flutter pub get"
]
