[tools]
flutter = "3.47.1"
node = "26.4.0"
"github:microsoft/apm" = "0.30.0"
lefthook = "2.1.9"
"npm:@fission-ai/openspec" = "1.13.0"

[tasks]
prepare = "lefthook install"
start = "flutter run"
# CI запускает эти же части параллельными jobs.
check = [
    { task = "check:static" },
    "bash tool/test_shard.sh 0 1",
    { task = "check:process-tests" }
]
"check:static" = [
    "dart format --output=none --set-exit-if-changed .",
    "bash test/tool/check_ci_scope_test.sh",
    "bash test/tool/test_shard_test.sh",
    "flutter analyze"
]
# Обычные тесты одной части: `mise run check:tests -- <номер от 0> <число частей>`.
"check:tests" = "bash tool/test_shard.sh"
# Вложенный Flutter пересоздаёт нативные артефакты SQLite в общей сборке.
# Эти наборы запускаются отдельно, чтобы не мешать параллельным чтениям.
"check:process-tests" = "flutter test --concurrency=1 --tags=flutter_process"
codegen = [
    "flutter gen-l10n",
    "dart run build_runner build --delete-conflicting-outputs",
    "dart run drift_dev schema dump lib/src/data/local/app_database.dart drift_schemas/"
]
codegen-check = "bash tool/check_generated.sh"
codegen-check-test = "bash tool/check_generated_test.sh"
setup = [
    "apm install --frozen",
    "flutter pub get"
]

[tasks.benchmark]
description = "Бенчмарки: время, очередь и сравнение с бюджетами"
run = "bash tool/benchmark.sh"
