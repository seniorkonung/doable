[tools]
flutter = "3.47.1"
node = "26.4.0"
"github:microsoft/apm" = "0.30.0"
lefthook = "2.1.9"
"npm:@fission-ai/openspec" = "1.13.0"

[tasks]
prepare = "lefthook install"
start = "flutter run"
# Корневой `flutter analyze` разбирает и вложенный пакет widgetbook/, поэтому
# его зависимости разрешаются до анализа.
check = [
    "dart format --output=none --set-exit-if-changed .",
    "bash test/tool/check_ci_scope_test.sh",
    "flutter pub get --enforce-lockfile --directory widgetbook",
    "flutter analyze",
    "flutter test --concurrency=2",
    "cd widgetbook && flutter test"
]
check-fast = [
    "dart format --output=none --set-exit-if-changed .",
    "bash test/tool/check_ci_scope_test.sh",
    "flutter pub get --enforce-lockfile --directory widgetbook",
    "flutter analyze",
    "flutter test --exclude-tags=slow",
    "cd widgetbook && flutter test"
]
codegen = [
    "flutter gen-l10n",
    "dart run build_runner build --delete-conflicting-outputs",
    "dart run drift_dev schema dump lib/src/data/local/app_database.dart drift_schemas/"
]
codegen-check = "bash tool/check_generated.sh"
codegen-check-test = "bash tool/check_generated_test.sh"
setup = [
    "apm install --frozen",
    "flutter pub get",
    "flutter pub get --directory widgetbook"
]

[tasks.widgetbook]
description = "Запустить Widgetbook на Linux-десктопе"
dir = "{{config_root}}/widgetbook"
run = "flutter run -d linux"
