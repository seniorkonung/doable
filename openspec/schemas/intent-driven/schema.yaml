name: intent-driven
version: 3
description: >-
  Intent-driven OpenSpec workflow - proposal -> Gherkin-style specs -> design ->
  adr -> plan -> iterative tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Create the proposal document that establishes WHY this change is needed.


      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does
      this solve? Why now?

      - **What Changes**: Bullet list of changes. Be specific about new
      capabilities, modifications, or removals. Mark breaking changes with
      **BREAKING**.

      - **Capabilities**: Identify which behaviour specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose behaviour is changing. Only include if spec-level behaviour changes, not just implementation details. Each needs an OpenSpec Markdown delta file at `specs/<name>/spec.md`. Check `openspec/specs/` for existing spec names. Leave empty if no behaviour changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.


      IMPORTANT: The Capabilities section is critical. It creates the contract
      between proposal and specs phases. Research existing specs before filling
      this in. Each capability listed here will need a corresponding spec file.


      Durable architectural decisions worth carrying across changes are
      distilled into ADR files at <repo>/docs/adr/ by a later step after design.


      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.


      This is the foundation - specs, design, adr, and tasks all build on this.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: >
      Create specification files that define WHAT the system should do.


      Create one spec file per capability listed in the proposal's Capabilities
      section.

      - New capabilities: use the exact kebab-case name from the proposal
      (specs/<capability>/spec.md).

      - Modified capabilities: use the existing spec folder name from
      openspec/specs/<capability>/ when creating the delta spec at
      specs/<capability>/spec.md.


      Delta operations (use ## headers):

      - **ADDED Requirements**: New capabilities

      - **MODIFIED Requirements**: Changed behavior - MUST include full updated
      content

      - **REMOVED Requirements**: Deprecated features - MUST include **Reason**
      and **Migration**

      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format


      Format requirements:

      - Each requirement: `### Requirement: <name>` followed by description

      - Use SHALL/MUST for normative requirements (avoid should/may)

      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format

      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3
      hashtags or bullets will fail silently.

      - Every requirement MUST have at least one scenario.


      MODIFIED requirements workflow:

      1. Locate the existing requirement in openspec/specs/<capability>/spec.md

      2. Copy the ENTIRE requirement block (from `### Requirement:` through all
      scenarios)

      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior

      4. Ensure header text matches exactly (whitespace-insensitive)


      Common pitfall: Using MODIFIED with partial content loses detail at
      archive time.

      If adding new concerns without changing existing behavior, use ADDED
      instead.


      Example:

      ```

      ## ADDED Requirements


      ### Requirement: User can export data

      The system SHALL allow users to export their data in CSV format.


      #### Scenario: Successful export

      - **WHEN** user clicks "Export" button

      - **THEN** system downloads a CSV file with all user data


      ## REMOVED Requirements


      ### Requirement: Legacy export

      **Reason**: Replaced by new export system

      **Migration**: Use new export endpoint at /api/v2/export

      ```


      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: >
      Create the design document that explains HOW to implement the change.


      When to include design.md (create only if any apply):

      - Cross-cutting change (multiple services/modules) or new architectural
      pattern

      - New external dependency or significant data model changes

      - Security, performance, or migration complexity

      - Ambiguity that benefits from technical decisions before coding


      Prior decisions (read existing ADRs first):

      Before writing, list every file in <repo>/docs/adr/. Build the supersession
      graph from each ADR's Supersedes field - an ADR is no longer in force if
      a later ADR's Supersedes points at it. Only the currently-in-force ADRs
      (accepted, not superseded) constrain this design. Older superseded ADRs
      are historical context only and MUST NOT be treated as live commitments.
      New design choices MUST be coherent with the in-force set. If a current
      ADR needs to be revisited, do not propose modifying it; flag it under
      Open Questions and let the adr step record a new superseding ADR.


      Sections:

      - **Context**: Background, current state, constraints, stakeholders

      - **Goals / Non-Goals**: What this design achieves and explicitly excludes

      - **Decisions**: Key technical choices with rationale (why X over Y?).
      Include alternatives considered for each decision.

      - **Risks / Trade-offs**: Known limitations, things that could go wrong.
      Format: [Risk] -> Mitigation

      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)

      - **Open Questions**: Outstanding decisions or unknowns to resolve.
      Include any in-force ADRs that this design suggests revisiting; the adr
      step will record the supersession.


      Focus on architecture and approach, not line-by-line implementation.

      Reference the proposal for motivation and specs for requirements.


      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal
      - specs
  - id: adr
    generates: adr.md
    description: Per-change ADR review manifest and durable decision handoff
    template: adr.md
    instruction: >
      Complete ADR review for this change by writing a concise manifest at
      openspec/changes/<change>/docs/adr.md. This change-local file is the artifact
      completion marker for the adr step. Existing files under <repo>/docs/adr/ are
      required context for the review, but they MUST NOT satisfy completion for
      a new change.


      If the change introduces a major durable architectural decision, also
      create an Architecture Decision Record under <repo>/docs/adr/. The path
      <repo>/docs/adr/ means the target repository's top-level adr/ folder beside
      openspec/, not any folder inside openspec/. Repository-level ADR files
      persist across changes and MUST be written outside openspec/.


      IRON RULE - ADRs are immutable once accepted. You MUST NOT edit a prior
      ADR file under any circumstance, not its Status, not its body, not its
      date. To change a previously accepted decision, record a NEW ADR whose
      Status is "accepted, supersedes ADR-NNNN" and whose `Supersedes:` field
      names the prior one. Design consumers derive what is currently in force
      by walking Supersedes links across the folder. The prior ADR's contents
      stay frozen as a historical record.


      Process:

      1. Read every existing ADR in <repo>/docs/adr/. Build the supersession graph
      from each ADR's Supersedes field. Note the highest sequence number in
      use.

      2. Re-read design.md. Identify decisions that meet ALL of these:

      - Establish a long-term architectural commitment (pattern, technology,
      boundary, contract) - not a tactical implementation detail.

      - Will affect future changes beyond this one.

      - Either aren't already captured by a currently-in-force ADR, OR
      intentionally diverge from one. If diverging, the new ADR supersedes the
      prior.

      3. For each qualifying decision, create a NEW repository-level file at
      <repo>/docs/adr/NNNN-kebab-title.md, where NNNN is a 4-digit sequence one
      greater than the highest existing. Include title, Status, Date, optional
      Supersedes, and MADR-short sections: Context, Decision, and
      Consequences. If this decision replaces a prior in-force ADR, set Status to
      "accepted, supersedes ADR-NNNN", populate the `Supersedes:` field, and
      explain in Context why the prior decision is being revisited. Do NOT
      touch the prior ADR's file.

      4. Write openspec/changes/<change>/docs/adr.md using the template. The
      manifest MUST state that ADR review completed for this change, list the
      in-force ADR context reviewed, and reference every repository-level ADR
      file created for this change. It MUST NOT duplicate full Context,
      Decision, or Consequences content from repository-level ADR files.

      5. If nothing meets the bar, do not invent ADRs. The manifest MUST
      explicitly state that no major durable architectural decisions were
      introduced and no new repository-level ADR files were created.


      Filename convention: NNNN-kebab-title.md (e.g.,
      0042-use-postgres-for-catalog.md). Sequence is monotonic across the
      whole repo and never reused.
    requires:
      - design
  - id: plan
    generates: plan.md
    description: Mutable high-level implementation direction
    template: plan.md
    instruction: >
      Create the phased implementation plan that forms the stable planning layer
      between the approved requirements and just-in-time task generation:


      requirements -> phased plan -> selected phase -> detailed tasks


      The unfinished part of the plan is a locally revisable forecast, not a
      progress tracker or an implementation checklist. It must give a later
      task-planning session enough direction to decompose one selected phase
      without committing future phases to detailed work that may become stale.


      Follow the supplied template.


      Sections:

      - **Direction**: Summarize the plan-wide delivery strategy, sequencing
        logic, and invariants that every phase must preserve. It should remain
        valid when unfinished phases are revised.

      - **Plan Constraints**: State only constraints that shape the plan as a
        whole. Omit this section when none are needed.

      - **Phase N**: Describe the fewest meaningful, strictly ordered,
        outcome-oriented state transitions needed to deliver the change. For
        every phase, state its objective, outcome, boundaries, and high-level
        readiness to advance.


      Rules:

      - Keep each phase broad enough to generate several related tasks but
        bounded enough to decompose directly without another phase-like layer.

      - Name and organize phases by coherent outcomes, not technical layers,
        routine disciplines, or implementation activities.

      - Do not include checkboxes, completion states, current progress, task IDs,
        estimated sizes, verification commands, or likely file paths.

      - Do not duplicate detailed requirements or technical decisions. Reference
        the specs, design, and ADRs that control them.

      - When revising the plan, determine completed phases from the supplied
        context. If tasks.md exists, treat checked tasks as evidence of completed
        work, not by themselves as proof that an entire phase is complete.
        Resolve uncertainty before revising a phase that may be completed.

      - Preserve completed phases verbatim. Revise the earliest affected
        unfinished phase and only the later phases whose direction, boundaries,
        or outcomes change. Surface conflicts with completed work instead of
        silently rewriting it.

      - Keep progress and completion state exclusively in tasks.md. Preserving a
        completed phase's wording does not make plan.md a progress tracker.


      Reference specs for required behavior, design for the current technical
      approach, and <repo>/docs/adr/ for durable architectural commitments.
    requires:
      - specs
      - design
      - adr
  - id: tasks
    generates: tasks.md
    description: Phase-scoped implementation task packages
    template: tasks.md
    instruction: |
      Create or update tasks.md by decomposing exactly one selected phase from
      plan.md. Treat this instruction and the supplied template as authoritative
      caller constraints. One invocation may create or update only one phase
      package. Never generate packages for all future phases at once.

      Re-read before every write:

      - the current plan.md;
      - the current tasks.md, when it already exists; and
      - every existing upstream dependency supplied for this artifact: proposal,
        specs, design, and the ADR review manifest, including referenced durable
        ADRs.

      Validate the phase ledger before selecting work:

      - Plan phases are the ordered `## Phase N: <title>` headings in plan.md.
        Their numbers must be unique, sequential, and start at 1.
      - Every represented phase in tasks.md is one package with the exact same
        heading as plan.md. The heading is the package's phase reference and
        must be the last content before that package's first checkbox.
      - Represented packages must form a continuous prefix Phase 1 through
        Phase K of the current plan, with no gaps, duplicates, or unknown phases.
      - At most one package may contain unchecked tasks. If one does, it must be
        the last represented package; every earlier package must be complete.
      - Stop without modifying tasks.md when phase numbers, references, ordering,
        completion state, or plan/tasks correspondence are missing, ambiguous,
        or contradictory. Report the exact inconsistency that must be resolved.

      Select exactly one phase package:

      - If tasks.md has no represented package, create only the Phase 1 package.
      - If the last represented package has unchecked tasks, update only that
        package and do not add another phase.
      - If every represented package is complete and plan.md has unrepresented
        phases, append only the first unrepresented phase, Phase K+1.
      - If every plan phase already has a complete package, make no task changes
        and report that no phase remains to plan.

      Preserve history while updating:

      - Preserve every checked task block verbatim, including its checked state,
        identifier, wording, nested metadata, order, and phase membership. Never
        uncheck a completed task.
      - Preserve completed phase headings verbatim. An unfinished package may
        adopt the current title for the same unambiguous phase number without
        moving any completed task to another phase.
      - When changed requirements require corrective work, represent that work
        as a new unchecked task in the selected unfinished or future phase. Do
        not rewrite completed work or reopen an earlier completed package. If
        the current plan has no suitable unfinished phase, stop and require a
        plan update before changing tasks.md.
      - Assign new tasks the next unused `N.X` identifier in their phase. Never
        reuse an identifier belonging to preserved history.

      Decompose only the selected phase's objective, outcome, boundaries, and
      readiness gate. Use specs for required behaviour, design for the current
      implementation approach, and durable ADRs for architectural constraints.
      Do not pull work forward from later phases.

      Give every task explicit acceptance criteria, verification, dependencies,
      likely files, and an XS/S/M scope estimate. The selected
      `## Phase N: <exact title>` heading is the only new level-two heading: put
      primary `- [ ] N.X ...` tasks directly beneath it, without task-group
      headings or other phase-like layers. Include a final tracked checkpoint
      whose completion proves the selected phase's `Ready to advance` condition.

      OpenSpec tracks only primary checkbox lines. Do not use checkboxes for
      nested acceptance criteria or metadata. If implementation changes
      behaviour specs, include strict change validation in the relevant task or
      phase checkpoint.
    requires:
      - proposal
      - specs
      - design
      - adr
      - plan
apply:
  requires:
    - plan
    - tasks
  tracks: tasks.md
  instruction: |
    Re-read every context file, especially the current plan.md and tasks.md,
    before implementation. Treat tasks.md as a phase ledger, not an end-to-end
    promise made when planning began.

    Before changing code or task checkboxes, validate all of these invariants:

    - plan.md has unique sequential `## Phase N: <title>` headings starting at 1;
    - each tasks.md package has the exact matching plan heading immediately
      before its first checkbox;
    - represented packages form a continuous prefix of plan.md;
    - no more than one package has unchecked tasks, and it is the last package;
    - completed packages precede the active package; and
    - every pending task belongs unambiguously to that active package.

    Stop without implementation if a phase reference is absent or ambiguous, or
    if plan.md and tasks.md contradict one another. Report the exact inconsistency
    and require the planning artifacts to be updated first.

    Work only through pending tasks in the last represented package and mark each
    checkbox complete only when its full task contract is satisfied. Do not begin
    work from an unrepresented future phase.

    After the package becomes complete, re-read plan.md and tasks.md. If plan.md
    still has unrepresented phases, report completion of `Phase N`, explicitly
    state that the change is not complete, stop, and propose updating tasks.md
    with the openspec-update-change workflow to append the next single phase
    package. Do not recommend archive yet.

    Report the whole change complete only when every phase in plan.md is
    represented by a complete package and all ledger invariants still hold. Then
    recommend verification before archive. Pause on blockers or unclear tasks.
